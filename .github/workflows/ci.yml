name: UI CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npx next build
        env:
          NEXT_PUBLIC_API_URL: "https://placeholder.vercel.app"
          NEXTAUTH_SECRET: "ci-secret"
